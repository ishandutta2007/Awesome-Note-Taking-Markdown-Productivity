<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#1a102f"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".7"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".3"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(.96);opacity:.4}}@keyframes float{0%{transform:translateY(0)}}.node-pulse,.node-pulse-delay{animation:pulse 4s ease-in-out infinite alternate}.node-pulse-delay{animation-delay:2s}.orbit-line{stroke-dasharray:6 6;animation:dash 30s linear infinite}.floating-tag{animation:float 6s ease-in-out infinite alternate}.floating-tag-2{animation:float 7s ease-in-out infinite alternate-reverse}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><g opacity=".18"><circle cx="150" cy="180" r="180" fill="none" stroke="#6366f1" stroke-width="1" class="orbit-line"/><circle cx="1050" cy="180" r="210" fill="none" stroke="#ec4899" stroke-width="1" class="orbit-line"/><line x1="150" x2="320" y1="180" y2="90" stroke="